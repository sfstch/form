<!DOCTYPE <html>
<html>
  <head>
    <meta charset="UTF8" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/5bfe23d569.js"
      crossorigin="anonymous"
    ></script>
    <title>Редактирование зависимости</title>
  </head>
  <body>
    <div class="container">
      <div class="increase-buttons">
        <button class="equal-left-center">
          <i class="fa-solid fa-equals"></i>
        </button>
        <button class="equal-bottom-center">
          <i class="fa-solid fa-equals"></i>
        </button>
        <button class="equal-bottom-left">
          <i class="fa-solid fa-equals"></i>
        </button>
      </div>
      <div class="header">
        <h1>Редактирование зависимости</h1>
        <div class="header-icons">
          <button><i class="fa-solid fa-expand icons-size"></i></button>
          <button><i class="fa-solid fa-xmark icons-size"></i></button>
        </div>
      </div>
      <section class="form-group">
        <h2>Название</h2>
        <input
          type="text"
          value="Норма.АВТ.Потери технологические"
          disabled="disabled"
        />
        <h2>Тип зависимости</h2>
        <div class="form-group-dependency-type">
          <select id="type" name="type" disabled="disabled">
            <option value="line">Линейный</option>
            <option value="period">Периодический</option>
            <option value="exponential">Экспоненциальный</option>
          </select>
          <button><i class="fa-regular fa-copy"></i></button>
        </div>
        <h2>Тип создания</h2>
        <input type="text" value="Импортированная" disabled="disabled" />
        <div class="checkbox">
          <input type="checkbox" />
          <label>Состояние зависимости</label>
        </div>
        <h2>Измерено</h2>
        <input type="text" />
        <h2>Согласовано</h2>
        <input type="text" />
        <h2>Для пересчета графа</h2>
        <input type="text" value="1234,000" />
        <div class="grid">
          <table>
            <caption>
              Объекты левой части
            </caption>
            <thead>
              <tr>
                <th scope="col">Группа</th>
                <th scope="col">Объект</th>
                <th scope="col">Расположение</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td scope="row"></td>
                <td></td>
                <td></td>
              </tr>
              <tr>
                <td scope="row">Измерение</td>
                <td>АВТ.Потери технологические</td>
                <td>Числитель</td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <td scope="row" colspan="3"></td>
              </tr>
            </tfoot>
          </table>
          <table>
            <caption>
              Объекты правой части
            </caption>
            <thead>
              <tr>
                <th scope="col">Группа</th>
                <th scope="col">Объект</th>
                <th scope="col">Расположение</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td scope="row"></td>
                <td></td>
                <td></td>
              </tr>
              <tr>
                <td scope="row">Вход в Узел\Установку</td>
                <td>АВТ(7)</td>
                <td>Числитель</td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <td scope="row" colspan="3"></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </section>
      <section class="buttons-bottom">
        <button><i class="fa-solid fa-arrow-rotate-left"></i>Отменить</button>
        <button><i class="fa-regular fa-floppy-disk"></i>Сохранить</button>
      </section>
    </div>
  </body>
</html>

<!DOCTYPE <html>
<html lang="en">
  <head>
    <meta charset="UTF8">
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/5bfe23d569.js" crossorigin="anonymous"></script>
    <title>Редактирование зависимости</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Редактирование зависимости</h1>
        <div class="header-icons">
           <button type="button" class="fa-solid fa-expand icons-size"></button>
           <button type="button" class="fa-solid fa-xmark icons-size"></button>
        </div>
      </div>
        <section class="top-form-group">
         <h2>Название</h2>
          <form action="#" method="POST">
            <input type="text" placeholder="Норма.АВТ.Потери технологические" disabled="true">
            <h2>Тип зависимости</h2>
            <div class="form-group-dependency-type">
            <select id="type" name="type">
                <option value="line">Линейная</option>
                <option value="period">Периодическая</option>
                <option value="exponential">Экспоненциальная</option>
            </select>
            <button type="button" class="fa-regular fa-copy"></button>
            </div>
             <h2>Тип создания</h2>
              <form action="#" method="POST">
                <input type="text">
             </form>
             <section class="checkbox">
                <input type="checkbox"/>
                <label>Состояние зависимости</label>
             </section>
        </section>
          <section class="bottom-form-group">
            <h2>Измерено</h2>
            <form action="#" method="POST">
                <input type="text" >
            </form>
            <h2>Согласовано</h2>
            <form action="#" method="POST">
                <input type="text" >
            </form>
            <h2>Для пересчета графа</h2>
            <form action="#" method="POST">
                <input type="text" placeholder="1234,000" >
            </form>
          </section>
          <section class="grid">
               <table>
                 <caption>  Объекты левой части
                 </caption>
                    <thead>
                     <tr>
                       <th scope="col">Группа</th>
                       <th scope="col">Объект</th>
                       <th scope="col">Расположение</th>
                     </tr>
                   </thead> 
                   <tbody>
                      <tr>
                       <th scope="row"></th>
                        <td></td>
                        <td></td>
                      </tr>
                      <tr>
                         <td scope="row">Измерение</td>
                         <td>АВТ.Потери технологические</td>
                         <td>Числитель</td>
                      </tr>
                   <tfoot>
                      <tr>
                        <td scope="row" colspan="3"></td>
                      </tr>
                  </tfoot>
               </table>
              <table>
                 <caption>  Объекты правой части
                 </caption>
                    <thead>
                     <tr>
                       <th scope="col">Группа</th>
                       <th scope="col">Объект</th>
                       <th scope="col">Расположение</th>
                     </tr>
                   </thead> 
                   <tbody>
                      <tr>
                       <th scope="row"></th>
                        <td></td>
                        <td></td>
                      </tr>
                      <tr>
                         <td scope="row">Вход в Узел\Установку</td>
                         <td>АВТ(7)</td>
                         <td>Числитель</td>
                      </tr>
                   <tfoot>
                      <tr>
                        <td scope="row" colspan="3"></td>
                      </tr>
                  </tfoot>
               </table>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
